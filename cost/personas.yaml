# Đầu vào mô phỏng CP3 bản đầu. Số trong phỏng vấn là tần suất vấn đề tự báo;
# mô hình giả định người dùng sẽ gửi mọi vấn đề đó cho sản phẩm.

sessions: 50
seed: 42

users:
  low: 500
  base: 721
  high: 1000
  source: "Base = 721 mã học viên giả danh hoá trong data/preclass/learners.csv (không có cột phân lớp nên chỉ là proxy, không phải số L3A); low 500 và high 1.000 là kịch bản tự ước tính. Challenge brief track A ghi quy mô K5 hơn 1.000 học viên L23 và L34, không suy ra sĩ số L3A."

